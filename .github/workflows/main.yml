name: Patch TikTok Lite for Android TV

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download APK from GitHub Release & Apktool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0 -R ${{ github.repository }} -p "*.apk" -O tiktok_orig.apk
          APKTOOL_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2lCb3RQZWFjaGVzL0Fwa3Rvb2wvcmVsZWFzZXMvZG93bmxvYWQvdjIuMTAuMC9hcGt0b29sXzIuMTAuMC5qYXI=" | base64 -d)
          curl -fL "$APKTOOL_URL" -o apktool.jar

      - name: Decompile, Add TV Banner & Rename to TikTok
        run: |
          java -jar apktool.jar d -s tiktok_orig.apk -o tiktok_decompiled

          mkdir -p tiktok_decompiled/res/drawable-xhdpi
          echo "" | base64 -d > make_banner.py
          python3 make_banner.py

          echo " " | base64 -d > patch_manifest.py
          python3 patch_manifest.py

      - name: Rebuild and Sign Patched APK
        run: |
          java -jar apktool.jar b tiktok_decompiled -o tiktok_unsigned.apk
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -f 4 tiktok_unsigned.apk tiktok_aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TikTok-TV-Patched.apk tiktok_aligned.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Patched
          path: TikTok-TV-Patched.apk
