name: Build TikTok TV Shortcut

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Mini Android TV Project
        run: |
          mkdir -p app/src/main/java/com/custom/tiktoktv49
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/build/classes
          mkdir -p app/build/dex

          python3 -c '
          import struct, zlib

          w, h = 320, 180
          cx, cy = w // 2, h // 2
          grid = [[0]*w for _ in range(h)]

          for y in range(h):
              for x in range(w):
                  dx, dy = x - cx, y - cy
                  # Nota musicale piccola e ben centrata (circa 44x56 px totali)
                  dist = ((dx + 7)**2 + (dy - 12)**2)**0.5
                  in_ring = (8 <= dist <= 16) and not (dx > -7 and dy < 12)
                  in_stem = (1 <= dx <= 9) and (-28 <= dy <= 12)
                  in_flag = (9 <= dx <= 24) and (-28 <= dy <= -20) and ((dx - 9) + (dy + 28) <= 16)
                  if in_ring or in_stem or in_flag:
                      grid[y][x] = 1

          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  m = grid[y][x]
                  c = grid[min(h-1, y+2)][min(w-1, x+2)]
                  r = grid[max(0, y-2)][max(0, x-2)]
                  if m:
                      raw.extend(b"\xff\xff\xff\xff")
                  elif c:
                      raw.extend(b"\x25\xf4\xee\xff")
                  elif r:
                      raw.extend(b"\xfe\x2c\x55\xff")
                  else:
                      raw.extend(b"\x14\x14\x14\xff")

          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(bytes(raw)))
          png += chunk(b"IEND", b"")
          with open("app/src/main/res/drawable-xhdpi/banner.png", "wb") as f:
              f.write(png)
          '

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/java/com/custom/tiktoktv49/LaunchActivity.java
          package com.custom.tiktoktv49;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class LaunchActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage("com.zhiliaoapp.musically.go");
                  if (launchIntent == null) {
                      launchIntent = getPackageManager().getLaunchIntentForPackage("com.zhiliaoapp.musically");
                  }
                  if (launchIntent != null) {
                      startActivity(launchIntent);
                  } else {
                      Toast.makeText(this, "TikTok non trovato sulla TV", Toast.LENGTH_SHORT).show();
                  }
                  finish();
              }
          }
          EOF

      - name: Compile and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/* | tail -n 1)

          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o app/build/res.zip
          $BUILD_TOOLS/aapt2 link -o app/build/unsigned.apk -I $PLATFORM/android.jar --manifest app/src/main/AndroidManifest.xml --java app/src/main/java app/build/res.zip

          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM/android.jar -d app/build/classes $(find app/src/main/java -name "*.java")
          $BUILD_TOOLS/d8 --output app/build/dex app/build/classes/com/custom/tiktoktv49/*.class

          cd app/build/dex && zip -u ../unsigned.apk classes.dex && cd ../../..
          $BUILD_TOOLS/zipalign -f 4 app/build/unsigned.apk app/build/aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TikTok-TV-Shortcut.apk app/build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Shortcut
          path: TikTok-TV-Shortcut.apk
