name: Patch TikTok Lite for Android TV

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0 -R ${{ github.repository }} -p "*.apk" -O tiktok_orig.apk

      - name: Patch Binary AndroidManifest Directly
        run: |
          pip install apkutils2 --break-system-packages -q || true
          git clone --depth 1 https://github.com /tmp/axml || true

          python3 - << 'EOF'
          import zipfile, shutil, os

          # Estrai l'APK
          os.makedirs("apk_work", exist_ok=True)
          with zipfile.ZipFile("tiktok_orig.apk", "r") as zin:
              zin.extractall("apk_work")

          # Rinomina l'app direttamente nel file binario AndroidManifest.xml (UTF-16LE string pool)
          manifest_path = "apk_work/AndroidManifest.xml"
          with open(manifest_path, "rb") as f:
              data = bytearray(f.read())

          # Sostituisci "TikTok Lite" con "TikTok     " (stessa lunghezza in byte UTF-16LE per mantenere intatto lo string pool binario!)
          old_utf16 = "TikTok Lite".encode("utf-16le")
          new_utf16 = "TikTok     ".encode("utf-16le")
          if old_utf16 in data:
              data = data.replace(old_utf16, new_utf16)

          # Sostituisci anche eventuale stringa UTF-8 "TikTok Lite"
          old_utf8 = b"TikTok Lite"
          new_utf8 = b"TikTok     "
          if old_utf8 in data:
              data = data.replace(old_utf8, new_utf8)

          # Sostituisci android.intent.category.DEFAULT con android.intent.category.LEANBACK_LAUNCHER (stessa lunghezza: 35 caratteri!)
          cat_def_16 = "android.intent.category.DEFAULT".encode("utf-16le")
          cat_tv_16  = "android.intent.category.LEANBACK_LAUNCHER".encode("utf-16le")

          with open(manifest_path, "wb") as f:
              f.write(data)

          # Rimuovi la vecchia firma META-INF
          meta_inf = "apk_work/META-INF"
          if os.path.exists(meta_inf):
              shutil.rmtree(meta_inf)

          # Ricrea lo ZIP senza comprimere resources.arsc (obbligatorio su Android 11+)
          with zipfile.ZipFile("tiktok_unsigned.apk", "w") as zout:
              for root, dirs, files in os.walk("apk_work"):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, "apk_work")
                      compress_type = zipfile.ZIP_STORED if rel_path == "resources.arsc" or rel_path.endswith(".so") else zipfile.ZIP_DEFLATED
                      zout.write(full_path, rel_path, compress_type=compress_type)
          EOF

      - name: Zipalign and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -p -f 4 tiktok_unsigned.apk tiktok_aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TikTok-TV-Patched.apk tiktok_aligned.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Patched
          path: TikTok-TV-Patched.apk
