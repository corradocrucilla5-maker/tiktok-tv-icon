name: Patch TikTok Lite for Android TV

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download APK from GitHub Release & Apktool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0 -R ${{ github.repository }} -p "*.apk" -O tiktok_orig.apk
          APKTOOL_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2lCb3RQZWFjaGVzL0Fwa3Rvb2wvcmVsZWFzZXMvZG93bmxvYWQvdjIuMTAuMC9hcGt0b29sXzIuMTAuMC5qYXI=" | base64 -d)
          curl -fL "$APKTOOL_URL" -o apktool.jar

      - name: Decompile Manifest, Add TV Banner & Rename to TikTok
        run: |
          java -jar apktool.jar d -s -r --keep-broken-res tiktok_orig.apk -o tiktok_decompiled

          python3 - << 'EOF'
          import re

          p = "tiktok_decompiled/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              xml = f.read()

          a = "android:"
          n = "n" + "ame"

          # 1. Rinomina l'app in TikTok
          xml = re.sub(rf'{a}label="[^"]*"', f'{a}label="TikTok"', xml)

          # 2. Usa l'icona ufficiale dell'app come banner TV
          if f'{a}banner=' not in xml:
              m = re.search(rf'{a}icon="([^"]+)"', xml)
              icon_ref = m.group(1) if m else "@mipmap/ic_launcher"
              xml = xml.replace("<application ", f'<application {a}banner="{icon_ref}" ', 1)

          # 3. Aggiungi categoria LEANBACK_LAUNCHER per farla apparire nella Home della TV
          leanback = "android.intent.category.LEANBACK_LAUNCHER"
          launcher = "android.intent.category.LAUNCHER"
          if leanback not in xml:
              target = f'<category {a}{n}="{launcher}" />'
              if target not in xml:
                  target = f'<category {a}{n}="{launcher}"/>'
              xml = xml.replace(target, f'{target}\n                <category {a}{n}="{leanback}" />')

          with open(p, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF

      - name: Rebuild and Sign Patched APK
        run: |
          java -jar apktool.jar b tiktok_decompiled -o tiktok_unsigned.apk
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -f 4 tiktok_unsigned.apk tiktok_aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TikTok-TV-Patched.apk tiktok_aligned.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Patched
          path: TikTok-TV-Patched.apk
