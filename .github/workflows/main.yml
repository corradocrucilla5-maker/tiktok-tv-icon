name: Build TikTok TV Shortcut

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Mini Android TV Project
        run: |
          mkdir -p app/src/main/java/com/custom/tiktoktv
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/build/classes
          mkdir -p app/build/dex

          python3 -c '
          import glob
          try:
              from PIL import Image
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "Pillow", "-q"])
              from PIL import Image

          files = glob.glob("*.png") + glob.glob("*.jpg") + glob.glob("*.jpeg")
          bg = Image.new("RGBA", (320, 180), (0, 0, 0, 255))
          if files:
              img = Image.open(files[0]).convert("RGBA")
              img.thumbnail((280, 150))
              x = (320 - img.width) // 2
              y = (180 - img.height) // 2
              bg.paste(img, (x, y), img)
          bg.save("app/src/main/res/drawable-xhdpi/banner.png", "PNG")
          '

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              package="com.custom.tiktoktv"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="TikTok"
                  android:banner="@drawable/banner"
                  android:icon="@drawable/banner">
                  <activity
                      android:name=".LaunchActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/custom/tiktoktv/LaunchActivity.java
          package com.custom.tiktoktv;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class LaunchActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage("com.zhiliaoapp.musically.go");
                  if (launchIntent == null) {
                      launchIntent = getPackageManager().getLaunchIntentForPackage("com.zhiliaoapp.musically");
                  }
                  if (launchIntent != null) {
                      startActivity(launchIntent);
                  } else {
                      Toast.makeText(this, "TikTok non trovato sulla TV", Toast.LENGTH_SHORT).show();
                  }
                  finish();
              }
          }
          EOF

      - name: Compile and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/* | tail -n 1)

          $BUILD_TOOLS/aapt package -f -m -J app/src/main/java -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $PLATFORM/android.jar
          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM/android.jar -d app/build/classes $(find app/src/main/java -name "*.java")
          $BUILD_TOOLS/d8 --output app/build/dex app/build/classes/com/custom/tiktoktv/*.class
          $BUILD_TOOLS/aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $PLATFORM/android.jar -F app/build/unsigned.apk app/build/dex
          $BUILD_TOOLS/zipalign -f 4 app/build/unsigned.apk app/build/aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TikTok-TV-Shortcut.apk app/build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Shortcut
          path: TikTok-TV-Shortcut.apk
